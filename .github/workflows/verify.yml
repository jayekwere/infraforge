name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/install-opa.mjs && node scripts/install-terraform.mjs
      - run: npm run build
      - run: npm run prepare:aws
      - run: npm run test:aws-plan
      - run: npm test && npm run demo
      - run: npm audit --audit-level=high
      - run: python3 -m unittest discover -s python -p 'test_*.py'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:adapters
      - run: docker build -t infraforge:verify .
      - run: npm run test:container
      - run: npm run test:compose
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: verification-evidence
          path: |
            docs/evidence/
            docs/screenshots/
            test-results/
          retention-days: 14
          if-no-files-found: error
